  .tag{color:var(--accent);font-weight:600;font-size:18px;margin:0 0 16px}
  .lede{color:var(--fg2);margin:0 auto 34px;font-size:16.5px}
  .dl{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;

  }
  .dl:hover{background:#3f7cf0;transform:translateY(-2px)}
  .meta{color:var(--fg3);font-size:13.5px;margin-top:13px}

  .points{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:46px}
  .pt{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 16px;text-align:center;
  }
  .pt b{display:block;font-size:14.5px;margin-bottom:5px}
  .pt span{color:var(--fg3);font-size:13px;line-height:1.5;display:block}

    padding:24px 28px;margin-top:16px;
  }
  h2{font-size:13px;margin:0 0 15px;color:var(--fg2);
     text-transform:uppercase;letter-spacing:1px;font-weight:600}
  ol{margin:0;padding-left:20px;color:var(--fg2)}

  ol li:last-child{margin-bottom:0}
  b{color:var(--fg);font-weight:600}
  .warn{background:#1a1508;border-color:#3d3115;color:#d5c7a3;font-size:14.5px}

  .warn b{color:#f0dcae}

  footer{margin-top:40px;color:var(--fg3);font-size:13px;text-align:center}

const sel = document.getElementById("lang");
for (const code in NAMES) {
  const o = document.createElement("option");
  o.value = code; o.textContent = NAMES[code];
  sel.appendChild(o);
}

function apply(code){
  const d = T[code] || T.en;
  document.documentElement.lang = code;
  document.title = d.title;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = d[el.dataset.t];
    // Strings carry only our own markup (<b>, <i>), never user input.
    if (v !== undefined) el.innerHTML = v;
  });
  sel.value = code;
}

function pick(){
  const saved = localStorage.getItem("vento_lang");
  if (saved && T[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const base = String(l).toLowerCase().split("-")[0];
    if (T[base]) return base;
  }
  return "en";
}

sel.addEventListener("change", () => {
  localStorage.setItem("vento_lang", sel.value);
  apply(sel.value);
});

apply(pick());
