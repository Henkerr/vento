<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Vento logo - tur 2</title>
<style>
  :root { --bg:#0d0f13; --card:#15181e; --ink:#f2f4f8; --dim:#98a1b1; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable Display","Segoe UI",sans-serif; padding:36px; width:1320px }
  h1 { font-weight:600; font-size:30px }
  .sub { color:var(--dim); margin:6px 0 26px; font-size:15px }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px }
  .card { background:radial-gradient(110% 80% at 50% 0%, #232a38 0%, var(--card) 62%); border:1px solid #ffffff10; border-radius:18px; padding:22px; position:relative }
  .num { position:absolute; top:16px; left:18px; font-size:13px; color:var(--dim); font-weight:600 }
  .tag { position:absolute; top:14px; right:16px; font-size:11px; color:#c9d4ff; background:#ffffff0d; border:1px solid #ffffff14; padding:2px 8px; border-radius:20px }
  .hero { height:230px; display:grid; place-items:center }
  .hero svg { width:176px; height:176px }
  .name { font-size:19px; font-weight:600 }
  .why { color:var(--dim); font-size:13.5px; margin-top:4px; line-height:1.45; min-height:58px }
  .sizes { display:flex; align-items:center; gap:14px; margin-top:14px; padding-top:14px; border-top:1px solid #ffffff10 }
  .tb { background:#20232b; border-radius:8px; padding:7px 10px; display:flex; gap:12px; align-items:center }
  .lt { background:#f3f3f3; border-radius:8px; padding:7px 10px; display:flex; gap:12px; align-items:center }
  .lab { font-size:11px; color:var(--dim); margin-right:auto }
  .word { display:flex; align-items:center; gap:10px; margin-top:14px }
  .word span { font-size:22px; font-weight:600; letter-spacing:.02em }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<defs>
  <!-- shared lighting -->
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>

  <!-- swept blade, drawn once: hub at 50,50, tip up-right -->
  <path id="blade" d="M50,50 C46,40 46,27 53,18 C60,9 75,6 83,12 C89,17 88,27 81,34 C72,43 61,47 50,50 Z"/>
  <linearGradient id="thermal" gradientUnits="userSpaceOnUse" x1="52" y1="48" x2="84" y2="10">
    <stop offset="0" stop-color="#2BB5FF"/><stop offset=".5" stop-color="#7268FF"/><stop offset="1" stop-color="#FF7B47"/>
  </linearGradient>
  <linearGradient id="bladeGloss" gradientUnits="userSpaceOnUse" x1="50" y1="10" x2="66" y2="44">
    <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="cap" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dfe6ff"/><stop offset="1" stop-color="#9aa8d6"/></radialGradient>
  <mask id="hubCut"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="10" fill="#000"/></mask>

  <!-- A: thermal vortex, Fluent lighting -->
  <symbol id="A" viewBox="0 0 100 100">
    <g filter="url(#soft)">
      <g mask="url(#hubCut)">
        <g id="bladeLit"><use href="#blade" fill="url(#thermal)"/><use href="#blade" fill="url(#bladeGloss)"/><use href="#blade" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width=".8"/></g>
        <use href="#bladeLit" transform="rotate(120 50 50)"/>
        <use href="#bladeLit" transform="rotate(240 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="7" fill="url(#cap)"/>
      <circle cx="50" cy="50" r="2.6" fill="#FF7B47"/>
    </g>
  </symbol>

  <!-- B: squircle app icon, night tile, ice blades with a warm core -->
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A3B8F"/><stop offset=".55" stop-color="#14205A"/><stop offset="1" stop-color="#0A1238"/></linearGradient>
  <radialGradient id="tileGlow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#4D7CFF" stop-opacity=".55"/><stop offset="1" stop-color="#4D7CFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="52" y1="48" x2="84" y2="10"><stop offset="0" stop-color="#8FD8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <radialGradient id="ember" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD29A"/><stop offset=".55" stop-color="#FF8A4C"/><stop offset="1" stop-color="#FF5A3C"/></radialGradient>
  <symbol id="B" viewBox="0 0 100 100">
    <g filter="url(#soft)">
      <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#tile)"/>
      <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#tileGlow)"/>
      <rect x="6.5" y="6.5" width="87" height="87" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".16"/>
      <g transform="translate(50 50) scale(.72) translate(-50 -50)">
        <g mask="url(#hubCut)">
          <use href="#blade" fill="url(#ice)"/>
          <use href="#blade" fill="url(#ice)" transform="rotate(120 50 50)"/>
          <use href="#blade" fill="url(#ice)" transform="rotate(240 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="7.5" fill="url(#ember)"/>
      </g>
    </g>
  </symbol>

  <!-- C: thermal V, cool arm + warm arm that curls into a gust -->
  <linearGradient id="vCool" gradientUnits="userSpaceOnUse" x1="18" y1="20" x2="48" y2="82"><stop offset="0" stop-color="#5AD1FF"/><stop offset="1" stop-color="#2563FF"/></linearGradient>
  <linearGradient id="vWarm" gradientUnits="userSpaceOnUse" x1="48" y1="82" x2="88" y2="22"><stop offset="0" stop-color="#6A5CFF"/><stop offset=".55" stop-color="#C45CF0"/><stop offset="1" stop-color="#FF7B47"/></linearGradient>
  <symbol id="C" viewBox="0 0 100 100">
    <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20,22 L47,80" stroke="url(#vCool)" stroke-width="14"/>
      <path d="M47,80 L68,34 C74,21 91,21 90,35 C89,43 80,45 76,39" stroke="url(#vWarm)" stroke-width="14"/>
      <path d="M20,22 L33,50" stroke="#fff" stroke-opacity=".35" stroke-width="3.5"/>
      <path d="M71,30 C76,23 86,24 88,31" stroke="#fff" stroke-opacity=".35" stroke-width="3.5"/>
    </g>
  </symbol>

  <!-- D: V made of two thermal blades meeting at a hub -->
  <path id="vBladeL" d="M48,84 C40,66 26,49 14,28 C12,23 16,19 21,20 C34,23 44,35 48,50 C51,62 51,74 48,84 Z"/>
  <linearGradient id="dL" gradientUnits="userSpaceOnUse" x1="48" y1="84" x2="16" y2="22"><stop offset="0" stop-color="#2563FF"/><stop offset="1" stop-color="#5AD1FF"/></linearGradient>
  <linearGradient id="dR" gradientUnits="userSpaceOnUse" x1="52" y1="84" x2="86" y2="22"><stop offset="0" stop-color="#7268FF"/><stop offset="1" stop-color="#FF7B47"/></linearGradient>
  <linearGradient id="dGloss" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="40" y2="60"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <symbol id="D" viewBox="0 0 100 100">
    <g filter="url(#soft)">
      <use href="#vBladeL" fill="url(#dL)"/><use href="#vBladeL" fill="url(#dGloss)"/>
      <g transform="translate(100 0) scale(-1 1)"><use href="#vBladeL" fill="url(#dR)"/><use href="#vBladeL" fill="url(#dGloss)"/></g>
      <circle cx="50" cy="83" r="6" fill="url(#cap)"/>
    </g>
  </symbol>

  <!-- E: vortex in a ring: three thermal blades spinning inside a thin orbit -->
  <symbol id="E" viewBox="0 0 100 100">
    <g filter="url(#soft)">
      <circle cx="50" cy="50" r="44" fill="none" stroke="url(#thermal)" stroke-width="4.5" stroke-dasharray="210 66" transform="rotate(-30 50 50)" stroke-linecap="round"/>
      <g transform="translate(50 50) scale(.78) translate(-50 -50)">
        <g mask="url(#hubCut)">
          <use href="#bladeLit" /><use href="#bladeLit" transform="rotate(120 50 50)"/><use href="#bladeLit" transform="rotate(240 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="7" fill="url(#cap)"/>
      </g>
    </g>
  </symbol>

  <!-- F: squircle tile with the thermal V in white -->
  <linearGradient id="tileV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".5" stop-color="#6D5BF5"/><stop offset="1" stop-color="#F0703F"/></linearGradient>
  <symbol id="F" viewBox="0 0 100 100">
    <g filter="url(#soft)">
      <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#tileV)"/>
      <rect x="6" y="6" width="88" height="44" rx="22" fill="url(#gloss)" opacity=".5"/>
      <rect x="6.5" y="6.5" width="87" height="87" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".22"/>
      <g transform="translate(50 52) scale(.62) translate(-55 -51)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="14">
        <path d="M20,22 L47,80"/><path d="M47,80 L68,34 C74,21 91,21 90,35 C89,43 80,45 76,39"/>
      </g>
    </g>
  </symbol>
</defs>
</svg>

<h1>Vento logo — tur 2</h1>
<div class="sub">Seçtiğiniz iki yön (Isı girdabı ve Rüzgarlı V) derinleştirildi: rafine eğriler, Windows 11 ışıklandırması, sıcak-soğuk renk geçişi. Alt satırda görev çubuğu, pencere ve tepsi boyutları.</div>
<div class="grid" id="grid"></div>
<script>
const C = [
  ['A','Isı girdabı','girdap','Kanatlar zarifleştirildi, her kanada ışık ve parlaklık verildi. Göbek cilalı bir kapak; ortasındaki sıcak nokta "ısı".'],
  ['B','Gece karosu','girdap','Windows 11 uygulama ikonu formu: lacivert karoda buz gibi kanatlar, ortada kor gibi sıcak bir çekirdek.'],
  ['C','Sıcak-soğuk V','V','V\'nin sol kolu soğuk mavi, sağ kolu ısınarak turuncuya dönüyor ve rüzgar kıvrımıyla bitiyor.'],
  ['D','Kanat V','karma','İki fan kanadı göbekte birleşip V oluyor: solu soğuk, sağı sıcak. İsim, fan ve sıcaklık tek şekilde.'],
  ['E','Yörünge','girdap','Girdap ince bir yörünge halkasının içinde dönüyor; halkanın açık kısmı hareket hissi veriyor.'],
  ['F','Renkli karo','V','Soğuktan sıcağa giden degrade karo üzerinde beyaz rüzgarlı V. Görev çubuğunda en çok öne çıkan.'],
];
const g = document.getElementById('grid');
C.forEach(([id,name,tag,why],i)=>{
  const u = (s)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="card"><div class="num">${id}</div><div class="tag">${tag}</div>
    <div class="hero"><svg><use href="#${id}"/></svg></div>
    <div class="name">${name}</div><div class="why">${why}</div>
    <div class="word">${u(28)}<span>Vento</span></div>
    <div class="sizes"><span class="lab">Boyutlar</span><div class="tb">${u(32)}${u(24)}${u(16)}</div><div class="lt">${u(32)}${u(16)}</div></div></div>`);
});
</script>
</body></html>
