<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#16181d;margin:0;padding:20px;display:flex;gap:20px;flex-wrap:wrap;width:1000px}
.c{background:#1f232b;border-radius:12px;padding:10px;color:#9aa;font:12px Segoe UI}
svg{width:200px;height:200px;display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="th" gradientUnits="userSpaceOnUse" x1="18" y1="22" x2="92" y2="30"><stop offset="0" stop-color="#4CC2FF"/><stop offset=".55" stop-color="#4CC2FF"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
</defs></svg>
<!-- 1: spiral built from two arcs -->
<div class="c">1 spiral two arcs<svg viewBox="0 0 100 100"><g fill="none" stroke="url(#th)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,24 L46,78 L67,34 A12,12 0 0 1 89,34 A8,8 0 0 1 77,42"/></g></svg></div>
<!-- 2: squalls-like curl: arm continues into a hook that curls down-left -->
<div class="c">2 squalls hook<svg viewBox="0 0 100 100"><g fill="none" stroke="url(#th)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,24 L46,78 L66,36 C70,27 77,22 84,23 C91,24 94,31 91,37 C88,42 81,42 79,37"/></g></svg></div>
<!-- 3: V + second gust line -->
<div class="c">3 V + gust<svg viewBox="0 0 100 100"><g fill="none" stroke="url(#th)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
<path d="M18,22 L44,76 L64,34 C68,25 75,20 83,21 C90,22 93,29 90,35 C87,40 80,40 78,35"/>
<path d="M62,58 H86" opacity=".9"/></g></svg></div>
<!-- 4: thinner, more open curl -->
<div class="c">4 thin open<svg viewBox="0 0 100 100"><g fill="none" stroke="url(#th)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,22 L47,80 L69,32 C73,23 82,18 89,22 C95,26 94,35 88,37"/></g></svg></div>
<!-- 5: V whose right arm is a wind line that bends horizontal -->
<div class="c">5 arm to wind<svg viewBox="0 0 100 100"><g fill="none" stroke="url(#th)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
<path d="M16,26 L44,78 L62,42 C66,34 72,30 80,30 C88,30 92,24 90,18"/></g></svg></div>
</body></html>
