<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Vento logo konseptleri</title>
<style>
  :root { --bg:#0f1115; --card:#171a20; --ink:#f2f4f8; --dim:#9aa3b2; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable Display","Segoe UI",sans-serif; padding:36px; width:1320px }
  h1 { font-weight:600; font-size:30px; letter-spacing:-.01em }
  .sub { color:var(--dim); margin:6px 0 26px; font-size:15px }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px }
  .card { background:radial-gradient(120% 90% at 50% 0%, #222733 0%, var(--card) 60%); border:1px solid #ffffff12; border-radius:16px; padding:22px; position:relative }
  .num { position:absolute; top:16px; left:18px; font-size:13px; color:var(--dim); font-weight:600 }
  .hero { height:200px; display:grid; place-items:center }
  .hero svg { width:150px; height:150px; filter:drop-shadow(0 10px 24px #0008) }
  .name { font-size:19px; font-weight:600; margin-top:4px }
  .why { color:var(--dim); font-size:13.5px; margin-top:4px; line-height:1.45; min-height:40px }
  .sizes { display:flex; align-items:center; gap:16px; margin-top:16px; padding-top:14px; border-top:1px solid #ffffff10 }
  .tb { background:#1c1f26; border-radius:8px; padding:8px 10px; display:flex; gap:12px; align-items:center }
  .lt { background:#f3f3f3; border-radius:8px; padding:8px 10px; display:flex; gap:12px; align-items:center }
  .lab { font-size:11px; color:var(--dim); margin-right:auto }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1 Gust V -->
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="20" y1="84" x2="92" y2="16"><stop offset="0" stop-color="#2463FF"/><stop offset="1" stop-color="#38D6FF"/></linearGradient>
    <symbol id="m1" viewBox="0 0 100 100">
      <g fill="none" stroke="url(#g1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20,22 L47,80"/>
        <path d="M47,80 L69,33 C75,20 92,21 90,34 C89,42 80,44 76,38"/>
      </g>
    </symbol>
    <!-- 2 Thermal vortex -->
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="50" y1="50" x2="80" y2="12"><stop offset="0" stop-color="#2FB7FF"/><stop offset=".55" stop-color="#7C6CFF"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
    <mask id="hub2"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="8" fill="#000"/></mask>
    <symbol id="m2" viewBox="0 0 100 100">
      <g mask="url(#hub2)">
        <path id="b2" fill="url(#g2)" d="M50,50 C43,37 46,18 61,11 C74,6 87,15 82,29 C78,40 63,45 50,50 Z"/>
        <use href="#b2" transform="rotate(120 50 50)"/>
        <use href="#b2" transform="rotate(240 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="3.6" fill="#FF7A45"/>
    </symbol>
    <!-- 3 Pinwheel -->
    <symbol id="m3" viewBox="0 0 100 100">
      <g id="p3">
        <path fill="#5CC8FF" d="M50,50 L50,7 C63,7 74,16 76,28 Z"/>
        <path fill="#1C8EF2" d="M50,50 L76,28 C79,38 74,46 64,49 Z"/>
      </g>
      <g transform="rotate(90 50 50)"><path fill="#A5A8FF" d="M50,50 L50,7 C63,7 74,16 76,28 Z"/><path fill="#6E6BF2" d="M50,50 L76,28 C79,38 74,46 64,49 Z"/></g>
      <g transform="rotate(180 50 50)"><path fill="#FF9EC8" d="M50,50 L50,7 C63,7 74,16 76,28 Z"/><path fill="#F0569A" d="M50,50 L76,28 C79,38 74,46 64,49 Z"/></g>
      <g transform="rotate(270 50 50)"><path fill="#FFD27A" d="M50,50 L50,7 C63,7 74,16 76,28 Z"/><path fill="#F5A524" d="M50,50 L76,28 C79,38 74,46 64,49 Z"/></g>
      <circle cx="50" cy="50" r="5" fill="#fff"/><circle cx="50" cy="50" r="2" fill="#9AA3B2"/>
    </symbol>
    <!-- 4 Aero ring -->
    <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="10" y1="80" x2="95" y2="20"><stop offset="0" stop-color="#1E5BFF"/><stop offset="1" stop-color="#3BE0FF"/></linearGradient>
    <symbol id="m4" viewBox="0 0 100 100">
      <g fill="none" stroke="url(#g4)" stroke-linecap="round">
        <path stroke-width="11" d="M66.7,28.3 A30,30 0 1 0 66.7,71.7"/>
        <path stroke-width="8" d="M50,39 H90"/>
        <path stroke-width="8" d="M43,50 H80"/>
        <path stroke-width="8" d="M50,61 H92"/>
      </g>
    </symbol>
    <!-- 5 V blades -->
    <linearGradient id="g5a" gradientUnits="userSpaceOnUse" x1="50" y1="86" x2="14" y2="18"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="g5b" gradientUnits="userSpaceOnUse" x1="50" y1="86" x2="88" y2="20"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <symbol id="m5" viewBox="0 0 100 100">
      <path fill="url(#g5a)" d="M47,86 C40,64 24,46 12,24 C26,17 40,25 46,40 C51,53 52,70 47,86 Z"/>
      <path fill="url(#g5b)" d="M53,86 C61,62 76,47 90,27 C77,19 62,25 55,40 C49,53 49,70 53,86 Z"/>
      <circle cx="50" cy="86" r="4.5" fill="#E0F2FE"/>
    </symbol>
    <!-- 6 Flow chevrons -->
    <linearGradient id="g6" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="90"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <symbol id="m6" viewBox="0 0 100 100">
      <g fill="none" stroke="url(#g6)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path opacity=".35" d="M18,18 Q50,46 82,18"/>
        <path opacity=".65" d="M18,40 Q50,68 82,40"/>
        <path d="M18,62 Q50,92 82,62"/>
      </g>
    </symbol>
  </defs>
</svg>

<h1>Vento logo konseptleri</h1>
<div class="sub">Hepsi bu pano için özgün çizim. Altta: görev çubuğu (32), pencere (24), tepsi (16) ve açık tema.</div>
<div class="grid" id="grid"></div>
<script>
const C = [
  ['m1','Rüzgarlı V','Sağ kolu bir rüzgar kıvrımıyla biten V. Hem isim hem rüzgar tek çizgide.'],
  ['m2','Isı girdabı','Üç kanatlı fan; kanatlar merkezde soğuk maviden uçta sıcak turuncuya döner. Fan + sıcaklık.'],
  ['m3','Fırıldak','Kağıt rüzgar gülü. Katlı iki tonlu kanatlar; oyuncaklı, sıcak ve akılda kalıcı.'],
  ['m4','Hava kanalı','Açık bir halka ve içinden akıp çıkan hava çizgileri: fanın hava üflemesi.'],
  ['m5','Kanat V','İki pervane kanadı aşağıda birleşip V oluyor. Uzaktan V, yakından pervane.'],
  ['m6','Akış','Aşağı süzülen üç hava dalgası; en öndeki net, arkadakiler soluk. Sakin ve sade.'],
];
const g = document.getElementById('grid');
C.forEach(([id,name,why],i)=>{
  const u = (s)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="card"><div class="num">${i+1}</div>
    <div class="hero"><svg><use href="#${id}"/></svg></div>
    <div class="name">${name}</div><div class="why">${why}</div>
    <div class="sizes"><span class="lab">Boyutlar</span><div class="tb">${u(32)}${u(24)}${u(16)}</div><div class="lt">${u(32)}${u(16)}</div></div></div>`);
});
</script>
</body></html>
